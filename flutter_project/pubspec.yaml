name: flutter_project
description: A new Flutter project.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

  fluwx:
    app_id: "wxfae9158c846191a0"
    debug_logging: true # Logging in debug mode.
    android:
    #    interrupt_wx_request: true # Defaults to true.
    #    flutter_activity: 'MainActivity' # Defaults to app's launcher
    ios:
      universal_link: https://www.zeai.ai/buganle/
      #    scene_delegate: true # Defaults to false.
      no_pay: true # Set to true to disable payment.
    #    ignore_security: true # Set to true to disable security seetings.

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  get: ^4.6.6
  json_annotation: ^4.8.1
  hive_flutter: ^1.1.0
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.1.0
  in_app_purchase: ^3.2.0
  share_plus: ^7.2.1
  fluwx: ^5.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Light.ttf
          weight: 100
        - asset: assets/fonts/NotoSerifSC-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/NotoSerifSC-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifSC-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerifSC-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSerifSC-Black.ttf
          weight: 900
